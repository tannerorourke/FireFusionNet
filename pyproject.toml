[project]
name = "fire-fusion"
version = "1.2.0"
description = "Spatio-temporal ConvFormer for wildfire ignition & cause prediction over Washington State"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2.2",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "rasterio",
    "pyhdf",
    "rioxarray",
    "geopandas",
    "shapely",
    "pyproj",
    "pyogrio",
    "fiona",
    "xarray",
    "zarr<3",
    "numcodecs",
    "dask",
    "netcdf4",
    "h5netcdf",
    "earthaccess",
    "requests",
    "s3fs",
    "boto3",
    "tensorboard",
]

# Version bounds live in requirements.txt, which is the install surface for both
# local and cloud. The bounds here stay loose so the two never contradict.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fire_fusion*"]
